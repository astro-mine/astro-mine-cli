[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "astro-mine-cli"
dynamic = ["version"]
description = "Astro-Mine-CLI — the Astro-Mine command line: one executable, `astro-mine <component> <verb>`, over the astro-mine-platform library."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Astro-Mine project contributors" }]
keywords = ["astro-mine", "cli", "command-line", "entry-points", "swarm"]
classifiers = [
  # `3 - Alpha`, not `1 - Planning`: this package ships a working console script from its first
  # commit. The platform-wide "Planning" drift is astro-mine/docs#40 -- do not add to the pile.
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
]
# EXACTLY ONE, AND ENFORCED (tests/test_packaging.py::test_depends_only_on_the_platform).
#
# This package used to declare no runtime dependencies at all. RFC-0011 §"Alternatives considered"
# (a) rejected the umbrella-that-depends-on-everything because `pip install` for one verb would
# drag Ray, a Rust toolchain, CP-SAT and SPICE onto the machine, breaking the local tier that
# "MUST always work" (conventions.md §7).
#
# Consolidation dissolved that premise. `astro-mine-platform` is ONE wheel that already carries
# Ray, CP-SAT, SPICE, Cap'n Proto and a compiled Rust extension, so there is no longer an install
# this dependency makes heavier -- the cost §1 refused to pay is now paid by the platform simply
# existing. Meanwhile the entry-point indirection it bought decoupled nothing: every component is
# always present, so first-party federation was a metadata round-trip that hid which function ran.
#
# What §1a actually protected is kept, and by a mechanism that still works: you pay the import
# cost of the command you ran and nothing else. `astro-mine --help` imports no component
# (tests/test_dispatch_all_verbs.py asserts the negative), because the top-level listing is static strings
# and the dispatcher imports exactly one module -- the one the user named.
#
# Adding a SECOND dependency here is a design change, not a convenience. Take it through the RFC.
dependencies = ["astro-mine-platform"]

[project.scripts]
# The ONE executable this distribution installs, and the only one the platform has.
# `astro-mine <component> <verb>` (conventions.md §13, normative, as amended by
# astro-mine-cli#12): the per-component binaries it used to sit alongside are gone.
astro-mine = "astro_mine.cli:main"

[project.urls]
Homepage = "https://github.com/astro-mine/astro-mine-cli"
Documentation = "https://github.com/astro-mine/docs"
Issues = "https://github.com/astro-mine/astro-mine-cli/issues"

[tool.uv.sources]
# Pinned to the commit that removed the platform's CLI surface (astro-mine-platform#1). A
# **rev**, not a branch: `uv.lock` records the resolved commit either way, but a rev makes the
# pin readable without opening the lock, and the platform publishes no tags yet.
#
# This must not float. The two repos are one change split in half -- the platform stops
# shipping `astro_mine/cli/`, this package starts providing it -- so a pin that moved could
# resolve a platform that still installs files at this package's import path.
#
# Moved for astro-mine-platform#5, which is the same situation a second time: the platform moved
# four shared contracts to Core as a clean break and made Hub an injected collaborator, and this
# package is the caller that has to hand the registry in. The old rev resolves a platform where
# `publish_prior` still takes `registry_path` and `TierPlugin` still lives in Mind, so it cannot
# stay.
#
# This is astro-mine-platform#7's squash commit on `main` -- the merge that moved those contracts.
astro-mine-platform = { git = "https://github.com/astro-mine/astro-mine-platform.git", rev = "72e139f5cb37e4df0e97fd7ba241e49f79867320" }

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  # A TEST dependency, not a runtime one, and the distinction is the whole reason it is here
  # rather than in `[project].dependencies` (which is enforced at exactly one entry by
  # tests/test_packaging.py::test_depends_only_on_the_platform).
  #
  # `astro-mine bench zoo-sync` / `zoo-search` drive the SQL scenario catalog, which the platform
  # puts behind its `bench-leaderboard` extra. Without it three tests failed on a bare
  # ModuleNotFoundError and the 15 statements they cover -- the whole `zoo-sync`/`zoo-search`
  # handler pair -- were the entire gap between this repo's coverage and its own 95% gate.
  #
  # Bare `sqlalchemy` rather than `astro-mine-platform[bench-leaderboard]`: the tests use SQLite
  # DSNs, so psycopg, pyjwt and httpx would install a Postgres stack nothing here connects to.
  # Version tracks the platform's own constraint so the two cannot resolve differently.
  "sqlalchemy>=2.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["src/astro_mine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top of file) in the migrated command suites, and only there.
#
# Each of these came from astro-mine-platform, where it drove `astro-mine <component> <verb>`
# directly. The migration put a shim above the original module -- a `main(argv)` that re-points at
# this package's one executable -- specifically so the test bodies could arrive untouched, which is
# what makes them evidence that the commands did not change. The original imports therefore sit
# below a function definition.
#
# Ignored rather than fixed: hoisting 69 imports would edit the migrated bodies to satisfy a rule
# about *this file's* layout, and the whole value of those bodies is that they were not edited. The
# ignore is per-file, so a genuine E402 anywhere else still fails.
#
# This was invisible until CI could run again -- the lint step had not executed since 2026-07-30
# (astro-mine-cli#30).
"tests/*/test_cli*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  # Builds a wheel, creates a virtualenv, and installs the umbrella alongside a fixture provider
  # distribution. Slower than the injected lane and NOT deselected in CI: it is the only place the
  # packaging metadata that makes entry-point discovery work is actually exercised.
  "integration: installs packages into a throwaway venv and drives the console script",
]

[tool.coverage.run]
source = ["src/astro_mine"]
# The integration lane runs the code in a separate interpreter, so its coverage is invisible here.
# The injected lane covers the same paths in-process; the two are complementary, and the gate is
# set against the in-process one.
#
# `__main__` is the `python -m astro_mine.cli` guard: unreachable in-process by construction, and
# exercised for real by tests/test_installed_provider.py, which runs it as a subprocess in the
# venv. Omitted rather than papered over with a coverage pragma, so the reason stays written down.
omit = ["*/cli/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
  "@(typing\\.)?overload",
]
