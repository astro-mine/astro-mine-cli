name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git history; a shallow clone has none, and the
          # build then fails or stamps a wrong version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # This step used to be absent, with a note explaining that astro-mine-cli declares no runtime
      # dependencies (RFC-0011) and so has nothing private to resolve. That note ended by saying:
      # "if it ever becomes necessary, the zero-dependency rule has already been broken upstream of
      # it." It was -- deliberately, by astro-mine-cli#12, which made `astro-mine-platform` this
      # package's one dependency and recorded why in `pyproject.toml`. The step was never restored,
      # so every run since has failed at `uv sync` with
      #
      #     fatal: could not read Username for 'https://github.com'
      #
      # ...meaning no lint, no type-check and no test has run in CI on this repository since
      # 2026-07-30. The prediction was right; nobody was watching when it came true.
      #
      # NOTE: this needs the `CORE_REPO_TOKEN` secret set **on this repository** -- org-level
      # secrets cannot be granted to private repos on the free plan, so it is per-repo and
      # astro-mine-cli does not have it yet.
      - name: Authenticate to private dependencies
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        # `uv run ruff`, never a pinned `uvx ruff`: the pinned form silently misses rules added
        # in newer releases, which surfaces as a CI-only failure the next time anything bumps.
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy src

      # The zero-dependency rule is asserted in the test lane
      # (tests/test_packaging.py::test_declares_no_runtime_dependencies), so it is enforced
      # locally and in CI by the same command, rather than by a bespoke workflow step that only
      # ever runs here.
      - name: Test (pytest + coverage gate)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=95

      # The claim this package makes about itself, checked the way a user would: build the
      # wheel, install it into an environment containing nothing else, and run it. No source
      # checkout, no dev group, no siblings -- if `astro-mine` needs anything we did not declare,
      # it fails here.
      - name: Install the built wheel into a bare environment and run it
        run: |
          uv build --wheel
          uv venv /tmp/bare-venv
          VIRTUAL_ENV=/tmp/bare-venv uv pip install dist/*.whl
          /tmp/bare-venv/bin/astro-mine --version
          /tmp/bare-venv/bin/astro-mine --help
          test -z "$(VIRTUAL_ENV=/tmp/bare-venv uv pip list --format json \
            | python -c 'import json,sys; print(" ".join(d["name"] for d in json.load(sys.stdin) if d["name"] != "astro-mine-cli"))')"
